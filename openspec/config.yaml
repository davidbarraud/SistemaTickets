schema: spec-driven
context: |
  Sistema Greenfield de Tickets de Soporte Técnico de Sistemas.
  Backend: Node.js con Express y ORM Prisma.
  Frontend: React con Vite y componentes modernos estilizados con Tailwind CSS.
  Base de Datos: MySQL 8.0 corriendo localmente en XAMPP (localhost:3306).
  Autenticación: API de Google (Google OAuth 2.0 / JWT).
  Testing: Vitest y Supertest.
  Idioma de los artefactos: Español.
rules:
  specs:
    - Escribir los requisitos funcionales en notación EARS y escenarios Given-When-Then.
  design:
    - El esquema relacional debe soportar usuarios (Solicitantes y Operadores) y tickets con estados.
  tasks:
    - "Aplicar Test-Driven Generation (TDG): escribir siempre los tests antes del código de producción."
# Project context (optional)
